# Host DB port 5433 avoids clashing with a local Postgres on 5432.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: accounts_db
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: '5432'
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx typeorm migration:run -d ./dist/config/data-source.js && node ./dist/main.js"

volumes:
  pgdata:
